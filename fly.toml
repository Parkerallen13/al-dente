# Fly.io config. `fly launch` fills in app and primary_region; secrets
# (APP_PASSWORD, ANTHROPIC_API_KEY) are set with `fly secrets set`, never here.
app = "al-dente"
primary_region = "dfw"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

# One disk for recipes, posts and the profile. A volume belongs to one machine,
# so the app runs as a single machine.
[[mounts]]
  source = "al_dente_data"
  destination = "/data"

# Sleeps when nobody's using it and wakes in a few seconds on the next visit,
# so you mostly pay for the time it's in use.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
