<!doctype html>
<html lang="en">

</head>

      Recipes

    <a class="tab" href="/cookbook" data-link data-tab="cookbook">

      <span class="burger-bars" aria-hidden="true"><span></span><span></span><span></span></span>

  <div class="layout-menu" id="layout-menu" role="dialog" aria-label="Choose a layout" hidden></div>

  <main id="app"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
